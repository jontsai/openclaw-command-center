name: Upstream Sync

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/jontsai/openclaw-command-center.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: check
        run: |
          LOCAL=$(git rev-parse origin/main)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Fork is already up to date with upstream."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            COUNT=$(git rev-list origin/main..upstream/main --count)
            echo "new_commits=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT new upstream commits."
          fi

      - name: Create sync branch and PR
        if: steps.check.outputs.up_to_date == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/upstream-sync-$(date +%Y%m%d)"
          git checkout -b "$BRANCH" origin/main
          git merge upstream/main --no-edit
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: sync fork with upstream (${{ steps.check.outputs.new_commits }} commits)" \
            --body "Automated sync from \`upstream/main\` — ${{ steps.check.outputs.new_commits }} new commit(s).

          Review the changes and merge to keep the fork up to date.

          _Generated by the upstream-sync workflow._" \
            --base main \
            --head "$BRANCH"
